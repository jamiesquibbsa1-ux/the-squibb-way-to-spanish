name: Build Squibb Spanish APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct complete Android project
        shell: bash
        run: |
          set -euo pipefail
          base64 -d build_inputs/squibb_payload.b64 > /tmp/squibb-payload.zip
          unzip -o /tmp/squibb-payload.zip -d .
          test -f app/src/main/assets/index.html
          test -f app/src/main/res/drawable-nodpi/squibb_crest.webp
          test -f app/src/main/java/com/squibbway/spanish/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name shareable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "The-Squibb-Way-to-Spanish.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Squibb-Way-to-Spanish-APK
          path: The-Squibb-Way-to-Spanish.apk
          if-no-files-found: error
