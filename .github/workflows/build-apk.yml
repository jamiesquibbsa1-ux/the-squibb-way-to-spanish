name: Build Squibb Spanish APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild full Squibb app asset
        shell: bash
        run: |
          set -euo pipefail
          cat app/src/main/assets/index.part*.b64 > /tmp/index.b64
          base64 -d /tmp/index.b64 > /tmp/index.html.gz
          gzip -dc /tmp/index.html.gz > app/src/main/assets/index.html
          rm app/src/main/assets/index.part*.b64
          test -s app/src/main/assets/index.html
          grep -q "The Squibb Way to Spanish" app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --info > build.log 2>&1
          code=$?
          cat build.log
          exit $code

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Squibb-Android-Build-Log
          path: build.log
          if-no-files-found: warn

      - name: Name shareable APK
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk "The-Squibb-Way-to-Spanish.apk"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: The-Squibb-Way-to-Spanish-APK
          path: The-Squibb-Way-to-Spanish.apk
          if-no-files-found: error
